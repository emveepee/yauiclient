name: Build yauiclient .deb (Debian 11, x11-legacy)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      libmpv_version:
        description: 'libmpv tarball version (must match a legacy, non -debian12 release on the wiki)'
        default: 'v0.41.0'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deb:
    name: Build yauiclient-x11-legacy amd64 .deb in debian:11
    runs-on: ubuntu-latest
    container:
      image: debian:11

    permissions:
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive
      LIBMPV_VERSION: ${{ inputs.libmpv_version || 'v0.41.0' }}

    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils build-essential \
            debhelper dpkg-dev devscripts fakeroot \
            ninja-build pkg-config \
            python3 python3-pip \
            lintian

      - name: Install CMake 3.20+ via pip
        # CMakeLists.txt requires CMake 3.20; Debian 11 ships 3.18. Kept on
        # 3.x to match the CMake 3.25 that the Debian 12 build uses.
        # pip installs into /usr/local/bin, which comes before /usr/bin on
        # PATH, so dh_auto_configure picks it up over the apt cmake that
        # tools/build-deb-legacy.sh installs as a build dependency.
        run: |
          pip3 install --no-cache-dir 'cmake>=3.20,<4'
          cmake --version

      - name: Checkout yauiclient
        uses: actions/checkout@v4

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Build .deb (x11-legacy)
        # build-deb-legacy.sh downloads the legacy libmpv SDK + runtime into
        # sdk/, installs any missing Debian 11 build deps, swaps
        # debian-legacy/ into place for dpkg-buildpackage, and collects the
        # results in bin/.
        run: |
          chmod +x tools/build-deb-legacy.sh
          ./tools/build-deb-legacy.sh --download "${LIBMPV_VERSION}"

      - name: Collect artefacts
        run: |
          mkdir -p out
          mv bin/yauiclient-x11-legacy_*.deb out/
          mv bin/yauiclient_*.changes out/ 2>/dev/null || true
          mv bin/yauiclient_*.buildinfo out/ 2>/dev/null || true
          ls -la out/

      - name: Summarise build
        run: |
          {
            echo "## yauiclient .deb build summary (Debian 11)"
            echo ""
            echo "**libmpv version (bundled):** \`${LIBMPV_VERSION}\`"
            echo ""
            echo "### Artefacts"
            echo ""
            echo '```'
            ls -la out/
            echo '```'
            echo ""
            for f in out/*.deb; do
              echo "### $(basename "$f")"
              echo ""
              echo '```'
              dpkg-deb -I "$f" | head -25
              echo '```'
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb artefacts
        uses: actions/upload-artifact@v4
        with:
          name: yauiclient-deb-legacy-${{ env.LIBMPV_VERSION }}
          path: out/*
          retention-days: 30
          if-no-files-found: error
